<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English Literature Mastery</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}header{background:#1e3a5f;color:#fff;text-align:center;padding:30px}nav{padding:20px;text-align:center}nav button{padding:12px 20px;margin:5px;font-size:16px;border:none;background:#d4af37;cursor:pointer;border-radius:5px}.container{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:25px;border-radius:10px} .answer-btn{display:block;width:100%;text-align:left;margin:10px 0;padding:15px}</style></head><body><header><h1>English Literature Mastery</h1><p>Edexcel A Level English Literature Revision</p></header><nav><button onclick="startQuiz('frankenstein')">Frankenstein</button><button onclick="startQuiz('handmaid')">The Handmaid's Tale</button><button onclick="startQuiz('comparison')">Comparison</button></nav><div class="container"><div id="quizArea"></div></div><script>const quizzes={frankenstein:[{question:'Why does Victor create the Creature?',answers:['Scientific ambition','To become wealthy','To impress Elizabeth','To gain political power'],correct:0,explanation:'Victor is driven by scientific ambition.'}],handmaid:[{question:'What is the primary role of Handmaids in Gilead?',answers:['Teaching','Military service','Child-bearing','Government administration'],correct:2,explanation:'Handmaids exist to reproduce.'}],comparison:[{question:'A major theme shared by both texts is:',answers:['Space exploration','Unchecked power','Professional sport','Colonial expansion'],correct:1,explanation:'Both explore consequences of unchecked power.'}]};let currentQuiz=[];let currentQuestion=0;function startQuiz(topic){currentQuiz=quizzes[topic];currentQuestion=0;showQuestion();}function showQuestion(){const q=currentQuiz[currentQuestion];document.getElementById('quizArea').innerHTML='<div class="card"><h2>'+q.question+'</h2>'+q.answers.map((a,i)=>'<button class="answer-btn" onclick="checkAnswer('+i+')">'+a+'</button>').join('')+'<div id="feedback"></div></div>';}function checkAnswer(i){const q=currentQuiz[currentQuestion];document.getElementById('feedback').innerHTML='<p><strong>'+ (i===q.correct?'Correct':'Not quite') +'</strong><br>'+q.explanation+'</p>';}</script></body></html>
